[tool.poetry]
name = "ai-agent-evaluation-framework"
version = "0.1.0"
description = "A production-grade AI Agent Evaluation Framework for a Travel and Accommodation Platform"
authors = ["Antigravity <antigravity@deepmind.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6.0"
google-generativeai = "^0.4.0"
openai = "^1.12.0"
python-dotenv = "^1.0.1"
pandas = "^2.2.0"
polars = "^0.20.10"
rich = "^13.7.0"
httpx = "^0.26.0"
click = "^8.1.7"
jinja2 = "^3.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^24.2.0"
mypy = "^1.8.0"
ruff = "^0.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
